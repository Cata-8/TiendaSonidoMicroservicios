spring.application.name=usuarios

# createDatabaseIfNotExist crea la base de datos sola la primera vez
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
# Permite que el front lea el mensaje de error (ej: "Ya existe un producto con ese código")
server.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0