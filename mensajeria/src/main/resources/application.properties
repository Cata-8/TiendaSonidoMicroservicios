
spring.application.name=mensajeria

spring.datasource.url=jdbc:mysql://localhost:3306/mensajeria?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082
# Permite que el front lea el mensaje de error
server.error.include-message=always
server.error.include-binding-errors=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- Seguridad (JWT) ----
# Los 4 servicios deben tener EXACTAMENTE el mismo secreto (mínimo 32 caracteres).
# En un entorno real se entrega por variable de entorno JWT_SECRETO y no se sube a GitHub.
seguridad.jwt.secreto=${JWT_SECRETO:sonido-vivo-secreto-jwt-de-desarrollo-2026-cambiar-en-produccion}

# Swagger UI: /swagger-ui.html   |   JSON: /v3/api-docs
